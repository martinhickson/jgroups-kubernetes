apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-it-sa
  namespace: kubernetes-it
  labels:
    kubernetes-it: jgroups

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-it-pod-reader
  namespace: kubernetes-it
  labels:
    kubernetes-it: jgroups
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-it-pod-reader-binding
  namespace: kubernetes-it
  labels:
    kubernetes-it: jgroups
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-it-pod-reader
subjects:
  - kind: ServiceAccount
    name: kubernetes-it-sa
    namespace: kubernetes-it
